<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Pickea — Servicios digitales para Cuba</title>
		<meta name="description" content="Pickea facilita a los cubanos el acceso a compras y pagos online de productos y servicios digitales. Recargas, streaming, suscripciones y más." />
		<meta name="theme-color" content="#080808" />

		<!-- Favicon -->
		<link rel="icon" type="image/jpeg" href="%sveltekit.assets%/images/pickea.jpg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/images/pickea.jpg" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://pickea.shop/v1" />
		<meta property="og:title" content="Pickea — Servicios digitales para Cuba" />
		<meta property="og:description" content="Recargas, streaming, suscripciones, licencias y más. Compra y paga servicios digitales desde Cuba." />
		<meta property="og:image" content="https://pickea.shop/v1/images/pickea.jpg" />
		<meta property="og:locale" content="es_CU" />
		<meta property="og:site_name" content="Pickea" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Pickea — Servicios digitales para Cuba" />
		<meta name="twitter:description" content="Recargas, streaming, suscripciones, licencias y más. Compra y paga servicios digitales desde Cuba." />
		<meta name="twitter:image" content="https://pickea.shop/v1/images/pickea.jpg" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
